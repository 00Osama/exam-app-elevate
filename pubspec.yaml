name: exam_app_elevate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management 
  flutter_bloc: ^9.1.1

  # api client
  dio: ^5.11.1

  # api client generator
  retrofit: ^4.9.0

  # DI
  get_it:
  injectable:

  # models generator
  json_annotation: ^4.12.0

  # svg support
  flutter_svg: ^2.4.0
  flutter_launcher_icons: ^0.14.4

  # Storage 
  flutter_secure_storage:
  
  # router
  go_router: ^18.1.4

  
  equatable:

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


  # code generator manager
  build_runner: ^2.16.1

  # boilerplate code package
  injectable_generator:
  json_serializable: ^6.15.2
  retrofit_generator: ^10.0.1
  flutter_gen_runner:



flutter:
  uses-material-design: true


  assets:
    - assets/


flutter_gen:
  output: lib/gen/ 

  integrations:
    image: true
    flutter_svg: true


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 